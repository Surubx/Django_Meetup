<!DOCTYPE html>
<!-- Template: signup.html
    Purpose: registration page used to create a new user account. The
    form is rendered using Django's `SignUpForm` and posts back to this view.
-->
<html>
<head>
    <meta charset="utf-8">
    <title>Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; }
        .card { max-width: 480px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #4f46e5; color: white; border: none; cursor: pointer; }
        .helptext { font-size: 12px; color: #666; display: block; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
        <p><a href="{% url 'login' %}">Already have an account?</a></p>
    </div>
</body>
</html>
