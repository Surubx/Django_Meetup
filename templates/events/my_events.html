<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Events</title>
</head>
<body>
    <h1>My Events</h1>
    {% for event in events %}
        <div>
            <h3>{{ event.title }}</h3>
            <p>{{ event.description }}</p>
        </div>
    {% empty %}
        <p>You have not joined any events yet.</p>
    {% endfor %}
</body>
</html>
